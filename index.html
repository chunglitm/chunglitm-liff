<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Chungli TM LIFF Poll Diagnostic</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #0f172a;
      color: #ffffff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    .box {
      width: 100%;
      max-width: 620px;
      margin: 20px auto;
      padding: 22px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 18px;
    }

    h1 {
      margin: 0 0 20px 0;
      color: #f2df74;
      font-size: 23px;
    }

    .status {
      margin: 12px 0;
      padding: 16px;
      background: #020617;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.55;
      word-break: break-word;
    }

    .ok {
      color: #34d399;
    }

    .info {
      color: #38bdf8;
    }

    .error {
      color: #f87171;
    }

    .diag {
      margin-top: 18px;
      padding: 14px;
      background: #020617;
      border: 1px solid #475569;
      border-radius: 12px;
    }

    .diag-title {
      color: #f2df74;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .diag-line {
      font-family: monospace;
      font-size: 12px;
      line-height: 1.55;
      margin-bottom: 5px;
      word-break: break-all;
    }

    .identity {
      display: none;
      margin-top: 16px;
      padding: 16px;
      background: #0b132b;
      border: 1px solid #059669;
      border-radius: 12px;
    }

    .identity-name {
      margin-bottom: 8px;
      color: #f2df74;
      font-size: 19px;
      font-weight: 700;
    }

    .identity-verified {
      margin-bottom: 10px;
      color: #34d399;
      font-size: 14px;
    }

    .identity-uid {
      color: #94a3b8;
      font-family: monospace;
      font-size: 11px;
      word-break: break-all;
    }

    #verifyFrame {
      display: none;
      width: 0;
      height: 0;
      border: 0;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🧪 Chungli TM Poll Diagnostic</h1>


    <div
      id="liffStatus"
      class="status info"
    >
      ⏳ Starting LIFF...
    </div>


    <div
      id="serverStatus"
      class="status info"
    >
      ⏳ Waiting for LINE login...
    </div>


    <div class="diag">

      <div class="diag-title">
        🔍 Poll Diagnostic
      </div>

      <div id="diagLog"></div>

    </div>


    <div
      id="identityBox"
      class="identity"
    >

      <div
        id="identityName"
        class="identity-name"
      ></div>


      <div class="identity-verified">
        ✅ Identity verified by LINE server
      </div>


      <div
        id="identityUid"
        class="identity-uid"
      ></div>

    </div>

  </div>


  <iframe
    id="verifyFrame"
    name="verifyFrame"
  ></iframe>


  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


  <script>

    const LIFF_ID =
      "2011276672-eLuALXUR";


    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyhmPjTJwPqJtoa8vqBRkKbozqA3id1SK3d9HDsDp2RD-UCiKWHuCa55ZElZtrx3SpUag/exec";


    let requestId =
      "";


    let verificationFinished =
      false;


    let pollCount =
      0;


    const MAX_POLLS =
      10;



    function diag(
      text,
      type
    ) {

      const log =
        document.getElementById(
          "diagLog"
        );


      const line =
        document.createElement(
          "div"
        );


      line.className =
        "diag-line " +
        (
          type ||
          "info"
        );


      line.textContent =
        text;


      log.appendChild(
        line
      );
    }



    function createRequestId() {

      try {

        if (
          window.crypto &&
          typeof window.crypto.randomUUID === "function"
        ) {

          return window.crypto
            .randomUUID()
            .replace(/-/g, "");
        }


        const array =
          new Uint32Array(4);


        window.crypto.getRandomValues(
          array
        );


        return Array.from(array)
          .map(function(n) {

            return n
              .toString(16)
              .padStart(8, "0");

          })
          .join("");


      } catch (err) {

        return (
          "fallback" +
          Date.now() +
          Math.floor(
            Math.random() * 1000000
          )
        );
      }
    }



    function sendTokenToServer(
      idToken
    ) {

      requestId =
        createRequestId();


      diag(
        "POST request_id created: " +
        requestId,
        "info"
      );


      const serverStatus =
        document.getElementById(
          "serverStatus"
        );


      serverStatus.textContent =
        "⏳ Sending ID Token securely to Apps Script...";


      serverStatus.className =
        "status info";


      const form =
        document.createElement(
          "form"
        );


      form.method =
        "POST";


      form.action =
        APPS_SCRIPT_URL;


      form.target =
        "verifyFrame";


      form.style.display =
        "none";


      const actionInput =
        document.createElement(
          "input"
        );


      actionInput.type =
        "hidden";


      actionInput.name =
        "action";


      actionInput.value =
        "liff_verify";


      form.appendChild(
        actionInput
      );


      const requestInput =
        document.createElement(
          "input"
        );


      requestInput.type =
        "hidden";


      requestInput.name =
        "request_id";


      requestInput.value =
        requestId;


      form.appendChild(
        requestInput
      );


      const tokenInput =
        document.createElement(
          "input"
        );


      tokenInput.type =
        "hidden";


      tokenInput.name =
        "id_token";


      tokenInput.value =
        idToken;


      form.appendChild(
        tokenInput
      );


      document.body.appendChild(
        form
      );


      diag(
        "Submitting POST form...",
        "info"
      );


      try {

        form.submit();


        diag(
          "POST form submitted.",
          "ok"
        );


      } catch (err) {

        diag(
          "POST submit ERROR: " +
          (
            err.message ||
            String(err)
          ),
          "error"
        );
      }


      setTimeout(
        function() {

          tokenInput.value =
            "";


          if (
            form.parentNode
          ) {

            form.parentNode.removeChild(
              form
            );
          }


          diag(
            "Token removed from DOM.",
            "ok"
          );

        },
        150
      );


      setTimeout(
        function() {

          diag(
            "Starting first poll...",
            "info"
          );


          pollVerificationResult();

        },
        1000
      );
    }



    window.chungliLiffPollCallback =
      function(response) {

        diag(
          "JSONP callback RECEIVED",
          "ok"
        );


        if (
          verificationFinished
        ) {

          diag(
            "Ignored callback because verification already finished.",
            "info"
          );

          return;
        }


        if (
          response &&
          response.ready === true
        ) {

          diag(
            "Response ready=true",
            "ok"
          );


          verificationFinished =
            true;


          handleVerificationResult(
            response.result || {}
          );


          return;
        }


        diag(
          "Response ready=false",
          "info"
        );


        if (
          pollCount < MAX_POLLS
        ) {

          setTimeout(
            pollVerificationResult,
            1000
          );


        } else {

          showVerificationError(
            "Verification timeout after polling."
          );
        }
      };



    function pollVerificationResult() {

      if (
        verificationFinished
      ) {

        diag(
          "Poll skipped: already finished.",
          "info"
        );

        return;
      }


      pollCount++;


      diag(
        "Poll #" +
        pollCount +
        " started",
        "info"
      );


      const serverStatus =
        document.getElementById(
          "serverStatus"
        );


      serverStatus.textContent =
        "⏳ Polling Apps Script... (" +
        pollCount +
        "/" +
        MAX_POLLS +
        ")";


      serverStatus.className =
        "status info";


      const script =
        document.createElement(
          "script"
        );


      const pollUrl =
        APPS_SCRIPT_URL +
        "?action=liff_poll" +
        "&request_id=" +
        encodeURIComponent(
          requestId
        ) +
        "&callback=" +
        encodeURIComponent(
          "chungliLiffPollCallback"
        ) +
        "&_=" +
        Date.now();


      diag(
        "Creating JSONP script tag...",
        "info"
      );


      script.src =
        pollUrl;


      script.async =
        true;


      script.onload =
        function() {

          diag(
            "JSONP script ONLOAD fired",
            "ok"
          );


          if (
            script.parentNode
          ) {

            script.parentNode.removeChild(
              script
            );
          }
        };


      script.onerror =
        function() {

          diag(
            "JSONP script ONERROR fired",
            "error"
          );


          if (
            script.parentNode
          ) {

            script.parentNode.removeChild(
              script
            );
          }


          if (
            !verificationFinished &&
            pollCount < MAX_POLLS
          ) {

            setTimeout(
              pollVerificationResult,
              1000
            );
          }
        };


      try {

        document.head.appendChild(
          script
        );


        diag(
          "JSONP script appended to HEAD",
          "ok"
        );


      } catch (err) {

        diag(
          "appendChild ERROR: " +
          (
            err.message ||
            String(err)
          ),
          "error"
        );
      }
    }



    function handleVerificationResult(
      result
    ) {

      const serverStatus =
        document.getElementById(
          "serverStatus"
        );


      if (
        result.ok === true &&
        result.verified === true &&
        result.userId
      ) {

        serverStatus.textContent =
          "✅ Server-side LINE verification PASSED";


        serverStatus.className =
          "status ok";


        document.getElementById(
          "identityBox"
        ).style.display =
          "block";


        document.getElementById(
          "identityName"
        ).textContent =
          result.displayName ||
          "LINE User";


        document.getElementById(
          "identityUid"
        ).textContent =
          "Verified UID: " +
          result.userId;


        diag(
          "Verification PASSED",
          "ok"
        );


      } else {

        showVerificationError(
          result.error ||
          "LINE identity verification failed."
        );
      }
    }



    function showVerificationError(
      message
    ) {

      verificationFinished =
        true;


      const serverStatus =
        document.getElementById(
          "serverStatus"
        );


      serverStatus.textContent =
        "❌ " +
        message;


      serverStatus.className =
        "status error";


      diag(
        "FINAL ERROR: " +
        message,
        "error"
      );
    }



    async function startLiff() {

      const liffStatus =
        document.getElementById(
          "liffStatus"
        );


      try {

        diag(
          "window load fired",
          "ok"
        );


        diag(
          "Calling liff.init()...",
          "info"
        );


        await liff.init({
          liffId:
            LIFF_ID
        });


        diag(
          "liff.init SUCCESS",
          "ok"
        );


        if (
          !liff.isLoggedIn()
        ) {

          liffStatus.textContent =
            "🔐 Redirecting to LINE Login...";


          diag(
            "Not logged in. Calling liff.login()",
            "info"
          );


          liff.login();

          return;
        }


        const idToken =
          liff.getIDToken();


        if (
          !idToken
        ) {

          throw new Error(
            "LINE ID Token unavailable."
          );
        }


        liffStatus.textContent =
          "✅ LIFF login successful. ID Token acquired.";


        liffStatus.className =
          "status ok";


        diag(
          "ID Token acquired. Token NOT displayed.",
          "ok"
        );


        sendTokenToServer(
          idToken
        );


      } catch (err) {

        liffStatus.textContent =
          "❌ LIFF error: " +
          (
            err.message ||
            String(err)
          );


        liffStatus.className =
          "status error";


        diag(
          "LIFF ERROR: " +
          (
            err.message ||
            String(err)
          ),
          "error"
        );
      }
    }



    window.addEventListener(
      "load",
      startLiff
    );

  </script>

</body>

</html>
