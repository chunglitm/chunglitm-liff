<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Chungli TM Secure LIFF Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #0f172a;
      color: #ffffff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    .box {
      width: 100%;
      max-width: 600px;
      margin: 20px auto;
      padding: 22px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 18px;
    }

    h1 {
      margin: 0 0 20px 0;
      color: #f2df74;
      font-size: 23px;
    }

    .status {
      margin: 12px 0;
      padding: 16px;
      background: #020617;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.55;
      word-break: break-word;
    }

    .ok {
      color: #34d399;
    }

    .info {
      color: #38bdf8;
    }

    .error {
      color: #f87171;
    }

    .identity {
      display: none;
      margin-top: 16px;
      padding: 16px;
      background: #0b132b;
      border: 1px solid #059669;
      border-radius: 12px;
    }

    .identity-name {
      margin-bottom: 8px;
      color: #f2df74;
      font-size: 19px;
      font-weight: 700;
    }

    .identity-verified {
      margin-bottom: 10px;
      color: #34d399;
      font-size: 14px;
    }

    .identity-uid {
      color: #94a3b8;
      font-family: monospace;
      font-size: 11px;
      word-break: break-all;
    }

    #verifyFrame {
      display: none;
      width: 0;
      height: 0;
      border: 0;
    }
  </style>
</head>


<body>

  <div class="box">

    <h1>🔐 Chungli TM Hardened V2</h1>


    <div
      id="liffStatus"
      class="status info"
    >
      ⏳ Starting LIFF...
    </div>


    <div
      id="serverStatus"
      class="status info"
    >
      ⏳ Waiting for LINE login...
    </div>


    <div
      id="identityBox"
      class="identity"
    >

      <div
        id="identityName"
        class="identity-name"
      ></div>


      <div class="identity-verified">
        ✅ Identity verified by LINE server
      </div>


      <div
        id="identityUid"
        class="identity-uid"
      ></div>

    </div>

  </div>


  <!--
    ID Token POST target.

    Token stays in POST body.
    It is never placed in the URL.
  -->
  <iframe
    id="verifyFrame"
    name="verifyFrame"
  ></iframe>


  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


  <script>

    const LIFF_ID =
      "2011276672-eLuALXUR";


    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyhmPjTJwPqJtoa8vqBRkKbozqA3id1SK3d9HDsDp2RD-UCiKWHuCa55ZElZtrx3SpUag/exec";


    let requestId =
      "";


    let verificationFinished =
      false;


    let pollCount =
      0;


    const MAX_POLLS =
      20;



    /*
     * ==========================================================
     * Generate random request ID
     * ==========================================================
     */

    function createRequestId() {

      if (
        window.crypto &&
        typeof window.crypto.randomUUID === "function"
      ) {

        return window.crypto
          .randomUUID()
          .replace(/-/g, "");
      }


      const array =
        new Uint32Array(4);


      window.crypto.getRandomValues(
        array
      );


      return Array.from(array)
        .map(function(n) {

          return n
            .toString(16)
            .padStart(8, "0");

        })
        .join("");
    }



    /*
     * ==========================================================
     * POST token to Apps Script
     * ==========================================================
     */

    function sendTokenToServer(
      idToken
    ) {

      requestId =
        createRequestId();


      const serverStatus =
        document.getElementById(
          "serverStatus"
        );


      serverStatus.textContent =
        "⏳ Sending ID Token securely to Apps Script...";


      serverStatus.className =
        "status info";


      const form =
        document.createElement(
          "form"
        );


      form.method =
        "POST";


      form.action =
        APPS_SCRIPT_URL;


      form.target =
        "verifyFrame";


      form.style.display =
        "none";


      /*
       * action
       */
      const actionInput =
        document.createElement(
          "input"
        );


      actionInput.type =
        "hidden";


      actionInput.name =
        "action";


      actionInput.value =
        "liff_verify";


      form.appendChild(
        actionInput
      );


      /*
       * request_id
       */
      const requestInput =
        document.createElement(
          "input"
        );


      requestInput.type =
        "hidden";


      requestInput.name =
        "request_id";


      requestInput.value =
        requestId;


      form.appendChild(
        requestInput
      );


      /*
       * LINE ID Token
       */
      const tokenInput =
        document.createElement(
          "input"
        );


      tokenInput.type =
        "hidden";


      tokenInput.name =
        "id_token";


      tokenInput.value =
        idToken;


      form.appendChild(
        tokenInput
      );


      document.body.appendChild(
        form
      );


      /*
       * Submit to hidden iframe.
       */
      form.submit();


      /*
       * Immediately remove token from DOM.
       */
      setTimeout(
        function() {

          tokenInput.value =
            "";


          if (form.parentNode) {

            form.parentNode.removeChild(
              form
            );
          }

        },
        150
      );


      /*
       * Give Apps Script a little time,
       * then start polling.
       */
      setTimeout(
        pollVerificationResult,
        800
      );
    }



    /*
     * ==========================================================
     * JSONP callback
     * ==========================================================
     */

    window.chungliLiffPollCallback =
      function(response) {

        if (
          verificationFinished
        ) {
          return;
        }


        if (
          response &&
          response.ready === true
        ) {

          verificationFinished =
            true;


          handleVerificationResult(
            response.result || {}
          );


          return;
        }


        /*
         * Not ready yet.
         */
        if (
          pollCount < MAX_POLLS
        ) {

          setTimeout(
            pollVerificationResult,
            1000
          );


        } else {

          showVerificationError(
            "Verification timeout: Apps Script did not produce a result."
          );
        }
      };



    /*
     * ==========================================================
     * Poll Apps Script using JSONP
     * ==========================================================
     */

    function pollVerificationResult() {

      if (
        verificationFinished
      ) {
        return;
      }


      pollCount++;


      const serverStatus =
        document.getElementById(
          "serverStatus"
        );


      serverStatus.textContent =
        "⏳ Verifying with LINE server... (" +
        pollCount +
        "/" +
        MAX_POLLS +
        ")";


      serverStatus.className =
        "status info";


      const script =
        document.createElement(
          "script"
        );


      /*
       * Only request_id appears in URL.
       *
       * ID Token is NOT included.
       */
      script.src =
        APPS_SCRIPT_URL +
        "?action=liff_poll" +
        "&request_id=" +
        encodeURIComponent(
          requestId
        ) +
        "&callback=" +
        encodeURIComponent(
          "chungliLiffPollCallback"
        ) +
        "&_=" +
        Date.now();


      script.async =
        true;


      script.onload =
        function() {

          if (
            script.parentNode
          ) {

            script.parentNode.removeChild(
              script
            );
          }
        };


      script.onerror =
        function() {

          if (
            script.parentNode
          ) {

            script.parentNode.removeChild(
              script
            );
          }


          if (
            !verificationFinished &&
            pollCount < MAX_POLLS
          ) {

            setTimeout(
              pollVerificationResult,
              1000
            );
          }
        };


      document.head.appendChild(
        script
      );
    }



    /*
     * ==========================================================
     * Handle verification result
     * ==========================================================
     */

    function handleVerificationResult(
      result
    ) {

      const serverStatus =
        document.getElementById(
          "serverStatus"
        );


      if (
        result.ok === true &&
        result.verified === true &&
        result.userId
      ) {

        serverStatus.textContent =
          "✅ Server-side LINE verification PASSED";


        serverStatus.className =
          "status ok";


        document.getElementById(
          "identityBox"
        ).style.display =
          "block";


        document.getElementById(
          "identityName"
        ).textContent =
          result.displayName ||
          "LINE User";


        document.getElementById(
          "identityUid"
        ).textContent =
          "Verified UID: " +
          result.userId;


      } else {

        showVerificationError(
          result.error ||
          "LINE identity verification failed."
        );
      }
    }



    /*
     * ==========================================================
     * Error display
     * ==========================================================
     */

    function showVerificationError(
      message
    ) {

      verificationFinished =
        true;


      const serverStatus =
        document.getElementById(
          "serverStatus"
        );


      serverStatus.textContent =
        "❌ Server verification failed: " +
        message;


      serverStatus.className =
        "status error";
    }



    /*
     * ==========================================================
     * LIFF startup
     * ==========================================================
     */

    async function startLiff() {

      const liffStatus =
        document.getElementById(
          "liffStatus"
        );


      const serverStatus =
        document.getElementById(
          "serverStatus"
        );


      try {

        await liff.init({
          liffId:
            LIFF_ID
        });


        if (
          !liff.isLoggedIn()
        ) {

          liffStatus.textContent =
            "🔐 Redirecting to LINE Login...";


          liffStatus.className =
            "status info";


          liff.login();

          return;
        }


        const idToken =
          liff.getIDToken();


        if (!idToken) {

          throw new Error(
            "LINE ID Token unavailable."
          );
        }


        liffStatus.textContent =
          "✅ LIFF login successful. ID Token acquired.";


        liffStatus.className =
          "status ok";


        serverStatus.textContent =
          "⏳ Starting server-side LINE verification...";


        serverStatus.className =
          "status info";


        /*
         * Never print or log ID Token.
         */
        sendTokenToServer(
          idToken
        );


      } catch (err) {

        liffStatus.textContent =
          "❌ LIFF error: " +
          (
            err &&
            err.message
              ? err.message
              : String(err)
          );


        liffStatus.className =
          "status error";


        serverStatus.textContent =
          "❌ Server verification was not started.";


        serverStatus.className =
          "status error";
      }
    }



    window.addEventListener(
      "load",
      startLiff
    );

  </script>

</body>

</html>
