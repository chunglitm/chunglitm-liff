<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Chungli TM Secure LIFF</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #0f172a;
      color: #ffffff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    .box {
      width: 100%;
      max-width: 600px;
      margin: 20px auto;
      padding: 22px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 18px;
    }

    h1 {
      margin: 0 0 20px 0;
      color: #f2df74;
      font-size: 23px;
    }

    .status {
      margin: 12px 0;
      padding: 16px;
      background: #020617;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.55;
      word-break: break-word;
    }

    .ok {
      color: #34d399;
    }

    .info {
      color: #38bdf8;
    }

    .error {
      color: #f87171;
    }

    .identity {
      display: none;
      margin-top: 16px;
      padding: 16px;
      background: #0b132b;
      border: 1px solid #059669;
      border-radius: 12px;
    }

    .identity-name {
      margin-bottom: 8px;
      color: #f2df74;
      font-size: 19px;
      font-weight: 700;
    }

    .identity-note {
      color: #34d399;
      font-size: 14px;
    }

    #verifyFrame {
      display: none;
      width: 0;
      height: 0;
      border: 0;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🔐 Chungli TM Secure Login</h1>


    <div
      id="liffStatus"
      class="status info"
    >
      ⏳ Starting LINE Login...
    </div>


    <div
      id="serverStatus"
      class="status info"
    >
      ⏳ Waiting for secure verification...
    </div>


    <div
      id="identityBox"
      class="identity"
    >

      <div
        id="identityName"
        class="identity-name"
      ></div>

      <div class="identity-note">
        ✅ LINE identity verified securely
      </div>

    </div>

  </div>


  <!--
    ID Token is submitted only through POST body.
    It is never placed in the URL.
  -->
  <iframe
    id="verifyFrame"
    name="verifyFrame"
  ></iframe>


  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


  <script>

    const LIFF_ID =
      "2011276672-eLuALXUR";


    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbz45-9gMRq2RWWtm6dkO2WIgKKFOiAU5MPHLMkW-bnMFEFSaRtX30vog3fMiafkFFLp/exec";


    let requestId =
      "";


    let verificationFinished =
      false;


    let pollCount =
      0;


    const MAX_POLLS =
      20;



    /*
     * ==========================================================
     * Random request ID
     * ==========================================================
     */
    function createRequestId() {

      try {

        if (
          window.crypto &&
          typeof window.crypto.randomUUID === "function"
        ) {

          return window.crypto
            .randomUUID()
            .replace(/-/g, "");
        }


        const array =
          new Uint32Array(4);


        window.crypto.getRandomValues(
          array
        );


        return Array.from(array)
          .map(function(n) {

            return n
              .toString(16)
              .padStart(8, "0");

          })
          .join("");


      } catch (err) {

        return (
          "fallback" +
          Date.now() +
          Math.floor(
            Math.random() * 1000000
          )
        );
      }
    }



    /*
     * ==========================================================
     * POST LINE ID Token to Apps Script
     * ==========================================================
     */
    function sendTokenToServer(
      idToken
    ) {

      requestId =
        createRequestId();


      const serverStatus =
        document.getElementById(
          "serverStatus"
        );


      serverStatus.textContent =
        "⏳ Verifying your LINE identity...";


      serverStatus.className =
        "status info";


      const form =
        document.createElement(
          "form"
        );


      form.method =
        "POST";


      form.action =
        APPS_SCRIPT_URL;


      form.target =
        "verifyFrame";


      form.style.display =
        "none";


      const actionInput =
        document.createElement(
          "input"
        );


      actionInput.type =
        "hidden";


      actionInput.name =
        "action";


      actionInput.value =
        "liff_verify";


      form.appendChild(
        actionInput
      );


      const requestInput =
        document.createElement(
          "input"
        );


      requestInput.type =
        "hidden";


      requestInput.name =
        "request_id";


      requestInput.value =
        requestId;


      form.appendChild(
        requestInput
      );


      const tokenInput =
        document.createElement(
          "input"
        );


      tokenInput.type =
        "hidden";


      tokenInput.name =
        "id_token";


      tokenInput.value =
        idToken;


      form.appendChild(
        tokenInput
      );


      document.body.appendChild(
        form
      );


      form.submit();


      /*
       * Remove token-containing DOM immediately.
       */
      setTimeout(
        function() {

          tokenInput.value =
            "";


          if (
            form.parentNode
          ) {

            form.parentNode.removeChild(
              form
            );
          }

        },
        150
      );


      /*
       * Begin JSONP poll.
       */
      setTimeout(
        pollVerificationResult,
        900
      );
    }



    /*
     * ==========================================================
     * JSONP callback
     * ==========================================================
     */
    window.chungliLiffPollCallback =
      function(response) {

        if (
          verificationFinished
        ) {
          return;
        }


        if (
          response &&
          response.ready === true
        ) {

          verificationFinished =
            true;


          handleVerificationResult(
            response.result || {}
          );


          return;
        }


        if (
          pollCount < MAX_POLLS
        ) {

          setTimeout(
            pollVerificationResult,
            1000
          );


        } else {

          showFatalError(
            "Verification timeout. Please close this page and open the tool again from LINE."
          );
        }
      };



    /*
     * ==========================================================
     * Poll Apps Script
     * ==========================================================
     */
    function pollVerificationResult() {

      if (
        verificationFinished
      ) {
        return;
      }


      pollCount++;


      const script =
        document.createElement(
          "script"
        );


      script.src =
        APPS_SCRIPT_URL +
        "?action=liff_poll" +
        "&request_id=" +
        encodeURIComponent(
          requestId
        ) +
        "&callback=" +
        encodeURIComponent(
          "chungliLiffPollCallback"
        ) +
        "&_=" +
        Date.now();


      script.async =
        true;


      script.onload =
        function() {

          if (
            script.parentNode
          ) {

            script.parentNode.removeChild(
              script
            );
          }
        };


      script.onerror =
        function() {

          if (
            script.parentNode
          ) {

            script.parentNode.removeChild(
              script
            );
          }


          if (
            !verificationFinished &&
            pollCount < MAX_POLLS
          ) {

            setTimeout(
              pollVerificationResult,
              1000
            );

          } else if (
            !verificationFinished
          ) {

            showFatalError(
              "Unable to contact the secure verification service."
            );
          }
        };


      document.head.appendChild(
        script
      );
    }



    /*
     * ==========================================================
     * Verified result
     * ==========================================================
     */
    function handleVerificationResult(
      result
    ) {

      const serverStatus =
        document.getElementById(
          "serverStatus"
        );


      if (
        result.ok !== true ||
        result.verified !== true
      ) {

        showFatalError(
          result.error ||
          "LINE identity verification failed."
        );

        return;
      }


      /*
       * Hardened V2 requires an opaque short-lived web session.
       */
      const sessionToken =
        String(
          result.sessionToken ||
          ""
        ).trim();


      if (!sessionToken) {

        showFatalError(
          "Secure web session was not issued. Please reopen the tool from LINE."
        );

        return;
      }


      document.getElementById(
        "identityBox"
      ).style.display =
        "block";


      document.getElementById(
        "identityName"
      ).textContent =
        result.displayName ||
        "Verified LINE User";


      /*
       * Guest Invitation is VPE / President only.
       */
      const permissions =
        result.permissions || {};


      if (
        permissions.guestInvitation !== true
      ) {

        serverStatus.textContent =
          "🔒 Access Restricted: Guest Invitation is available only to VPE and Club President.";


        serverStatus.className =
          "status error";

        return;
      }


      serverStatus.textContent =
        "✅ Verified. Opening Guest Invitation Console...";


      serverStatus.className =
        "status ok";


      /*
       * Only the opaque short-lived session token is placed in the URL.
       * The LINE UID and ID Token are NOT placed in the URL.
       */
      const guestUrl =
        APPS_SCRIPT_URL +
        "?page=guest" +
        "&session=" +
        encodeURIComponent(
          sessionToken
        );


      setTimeout(
        function() {

          window.location.replace(
            guestUrl
          );

        },
        500
      );
    }



    /*
     * ==========================================================
     * Fatal error
     * ==========================================================
     */
    function showFatalError(
      message
    ) {

      verificationFinished =
        true;


      const serverStatus =
        document.getElementById(
          "serverStatus"
        );


      serverStatus.textContent =
        "❌ " +
        message;


      serverStatus.className =
        "status error";
    }



    /*
     * ==========================================================
     * LIFF startup
     * ==========================================================
     */
    async function startLiff() {

      const liffStatus =
        document.getElementById(
          "liffStatus"
        );


      const serverStatus =
        document.getElementById(
          "serverStatus"
        );


      try {

        await liff.init({
          liffId:
            LIFF_ID
        });


        if (
          !liff.isLoggedIn()
        ) {

          liffStatus.textContent =
            "🔐 Redirecting to LINE Login...";


          liffStatus.className =
            "status info";


          liff.login();

          return;
        }


        const idToken =
          liff.getIDToken();


        if (!idToken) {

          throw new Error(
            "LINE ID Token unavailable."
          );
        }


        liffStatus.textContent =
          "✅ LINE Login successful.";


        liffStatus.className =
          "status ok";


        serverStatus.textContent =
          "⏳ Starting secure server verification...";


        serverStatus.className =
          "status info";


        /*
         * Never display or log the ID Token.
         */
        sendTokenToServer(
          idToken
        );


      } catch (err) {

        liffStatus.textContent =
          "❌ LINE Login error: " +
          (
            err &&
            err.message
              ? err.message
              : String(err)
          );


        liffStatus.className =
          "status error";


        serverStatus.textContent =
          "❌ Secure verification was not started.";


        serverStatus.className =
          "status error";
      }
    }



    window.addEventListener(
      "load",
      startLiff
    );

  </script>

</body>
</html>
