<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Chungli TM Secure LIFF Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #0f172a;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 600px;
      margin: 20px auto;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 22px;
    }

    h1 {
      color: #f2df74;
      font-size: 23px;
      margin: 0 0 20px 0;
    }

    .status {
      background: #020617;
      border-radius: 12px;
      padding: 16px;
      margin: 12px 0;
      font-size: 15px;
      line-height: 1.55;
      word-break: break-word;
    }

    .ok {
      color: #34d399;
    }

    .info {
      color: #38bdf8;
    }

    .error {
      color: #f87171;
    }

    .identity {
      display: none;
      background: #0b132b;
      border: 1px solid #059669;
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
    }

    .identity-name {
      color: #f2df74;
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .identity-verified {
      color: #34d399;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .identity-uid {
      color: #94a3b8;
      font-family: monospace;
      font-size: 11px;
      word-break: break-all;
    }

    #verifyFrame {
      display: none;
      width: 0;
      height: 0;
      border: 0;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🔐 Chungli TM Hardened V2</h1>


    <div
      id="liffStatus"
      class="status info"
    >
      ⏳ Starting LIFF...
    </div>


    <div
      id="serverStatus"
      class="status info"
    >
      ⏳ Waiting for LINE login...
    </div>


    <div
      id="identityBox"
      class="identity"
    >

      <div
        id="identityName"
        class="identity-name"
      >
      </div>


      <div class="identity-verified">
        ✅ Identity verified by LINE server
      </div>


      <div
        id="identityUid"
        class="identity-uid"
      >
      </div>

    </div>

  </div>


  <!--
    Hardened V2 verification result is loaded here.

    ID Token is sent using POST body.
    It is NOT placed in the URL.
  -->
  <iframe
    id="verifyFrame"
    name="verifyFrame"
  ></iframe>


  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


  <script>

    const LIFF_ID =
      "2011276672-eLuALXUR";


    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyhmPjTJwPqJtoa8vqBRkKbozqA3id1SK3d9HDsDp2RD-UCiKWHuCa55ZElZtrx3SpUag/exec";


    let verificationStarted =
      false;


    let verificationFinished =
      false;


    /*
     * ==========================================================
     * Check that verification result came from Google
     * ==========================================================
     */

    function isAllowedGoogleOrigin(origin) {

      try {

        const url =
          new URL(origin);


        if (url.protocol !== "https:") {
          return false;
        }


        return (
          url.hostname === "script.google.com" ||
          url.hostname === "script.googleusercontent.com" ||
          url.hostname.endsWith(
            ".script.googleusercontent.com"
          )
        );


      } catch (e) {

        return false;
      }
    }



    /*
     * ==========================================================
     * Receive verified result from Apps Script
     * ==========================================================
     */

    window.addEventListener(
      "message",
      function(event) {

        const data =
          event.data || {};


        if (
          data.type !==
          "CHUNGLI_LIFF_VERIFY_RESULT"
        ) {
          return;
        }


        if (
          !isAllowedGoogleOrigin(
            event.origin
          )
        ) {

          return;
        }


        if (verificationFinished) {
          return;
        }


        verificationFinished =
          true;


        const result =
          data.result || {};


        const serverStatus =
          document.getElementById(
            "serverStatus"
          );


        if (
          result.ok === true &&
          result.verified === true &&
          result.userId
        ) {

          serverStatus.textContent =
            "✅ Server-side LINE verification PASSED";


          serverStatus.className =
            "status ok";


          document.getElementById(
            "identityBox"
          ).style.display =
            "block";


          document.getElementById(
            "identityName"
          ).textContent =
            result.displayName ||
            "LINE User";


          document.getElementById(
            "identityUid"
          ).textContent =
            "Verified UID: " +
            result.userId;


        } else {

          serverStatus.textContent =
            "❌ Server verification failed: " +
            (
              result.error ||
              "Unknown verification error"
            );


          serverStatus.className =
            "status error";
        }

      }
    );



    /*
     * ==========================================================
     * POST ID Token to Apps Script
     * ==========================================================
     */

    function verifyWithServer(idToken) {

      if (verificationStarted) {
        return;
      }


      verificationStarted =
        true;


      const serverStatus =
        document.getElementById(
          "serverStatus"
        );


      serverStatus.textContent =
        "⏳ Sending ID Token securely to Apps Script...";


      serverStatus.className =
        "status info";


      /*
       * Create a temporary HTML form.
       *
       * This avoids CORS because this is normal browser
       * form submission rather than fetch().
       */
      const form =
        document.createElement(
          "form"
        );


      form.method =
        "POST";


      form.action =
        APPS_SCRIPT_URL;


      form.target =
        "verifyFrame";


      form.style.display =
        "none";


      /*
       * action
       */
      const actionInput =
        document.createElement(
          "input"
        );


      actionInput.type =
        "hidden";


      actionInput.name =
        "action";


      actionInput.value =
        "liff_verify";


      form.appendChild(
        actionInput
      );


      /*
       * LINE ID Token
       */
      const tokenInput =
        document.createElement(
          "input"
        );


      tokenInput.type =
        "hidden";


      tokenInput.name =
        "id_token";


      tokenInput.value =
        idToken;


      form.appendChild(
        tokenInput
      );


      document.body.appendChild(
        form
      );


      /*
       * Submit into hidden iframe.
       */
      form.submit();


      /*
       * Remove token-containing DOM elements immediately
       * after browser starts submission.
       */
      setTimeout(
        function() {

          tokenInput.value =
            "";


          if (form.parentNode) {

            form.parentNode.removeChild(
              form
            );
          }

        },
        100
      );


      /*
       * Diagnostic timeout.
       */
      setTimeout(
        function() {

          if (
            !verificationFinished
          ) {

            serverStatus.textContent =
              "❌ Verification timeout: Apps Script did not return a result within 20 seconds.";


            serverStatus.className =
              "status error";
          }

        },
        20000
      );
    }



    /*
     * ==========================================================
     * LIFF Startup
     * ==========================================================
     */

    async function startLiff() {

      const liffStatus =
        document.getElementById(
          "liffStatus"
        );


      const serverStatus =
        document.getElementById(
          "serverStatus"
        );


      try {

        await liff.init({
          liffId: LIFF_ID
        });


        if (!liff.isLoggedIn()) {

          liffStatus.textContent =
            "🔐 Redirecting to LINE Login...";


          liffStatus.className =
            "status info";


          liff.login();

          return;
        }


        const idToken =
          liff.getIDToken();


        if (!idToken) {

          throw new Error(
            "LINE ID Token unavailable."
          );
        }


        liffStatus.textContent =
          "✅ LIFF login successful. ID Token acquired.";


        liffStatus.className =
          "status ok";


        serverStatus.textContent =
          "⏳ Starting server-side LINE verification...";


        serverStatus.className =
          "status info";


        /*
         * Send token to Apps Script.
         *
         * We deliberately do NOT display or log the token.
         */
        verifyWithServer(
          idToken
        );


      } catch (err) {

        liffStatus.textContent =
          "❌ LIFF error: " +
          (
            err &&
            err.message
              ? err.message
              : String(err)
          );


        liffStatus.className =
          "status error";


        serverStatus.textContent =
          "❌ Server verification was not started.";


        serverStatus.className =
          "status error";
      }
    }



    window.addEventListener(
      "load",
      startLiff
    );

  </script>

</body>

</html>
